<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dong-hyeon Shin</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        font-family: 'Inter', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
        background: #0f1115;
        color: #f5f5f5;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      main {
        width: min(420px, 90vw);
        padding: 2.5rem;
        background: rgba(255, 255, 255, 0.02);
        border-radius: 24px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        text-align: center;
      }
      img {
        width: 112px;
        height: 112px;
        border-radius: 50%;
        object-fit: cover;
        margin-bottom: 1.5rem;
        border: 2px solid rgba(255, 255, 255, 0.2);
      }
      h1 {
        margin: 0 0 0.8rem;
        font-family: 'Sora', 'Noto Sans KR', sans-serif;
        font-size: 2.15rem;
        letter-spacing: 0.02em;
      }
      ul {
        list-style: none;
        padding: 0;
        margin: 1.5rem auto 0;
        line-height: 1.8;
        text-align: left;
        display: inline-block;
      }
      li {
        padding-left: 1.2rem;
        position: relative;
        margin: 0.35rem 0;
      }
      li::before {
        content: '';
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #9ac5ff;
        position: absolute;
        left: 0;
        top: 0.85rem;
      }
      .cta {
        margin-top: 1.5rem;
        display: flex;
        justify-content: center;
        gap: 1rem;
        font-size: 0.95rem;
      }
      .cta a {
        color: inherit;
        text-decoration: none;
        border-bottom: 1px solid transparent;
        padding-bottom: 0.1rem;
        transition: border-color 0.2s;
      }
      .cta a:hover {
        border-bottom-color: rgba(255, 255, 255, 0.4);
      }
    </style>
  </head>
  <body>
    <main>
      <img src="profile.png" alt="Dong-hyeon Shin" />
      <h1>Dong-hyeon Shin</h1>
      <ul>
        <li>Software Engineer</li>
        <li>3× AWS Certified · CKAD</li>
        <li>Based in Seoul, Korea</li>
        <li>6 years of experience</li>
      </ul>
      <div class="cta">
        <a href="resume_ko.html">🇰🇷 한국어 이력서</a>
        <a href="resume_en.html">🇺🇸 English Resume</a>
      </div>
    </main>
  </body>
</html>
